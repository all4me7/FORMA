function askDelete(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;dlg.innerHTML=`<h2>Usunąć zadanie?</h2><p>${esc(t.name)}</p><p class="muted">Tej operacji nie można cofnąć.</p><div class="actions"><button class="light" id="cancelDelete">Anuluj</button><button class="danger" id="confirmDelete">Usuń</button></div>`;$('cancelDelete').onclick=()=>dlg.close();$('confirmDelete').onclick=()=>{dlg.close();animateRemoval(findCard(id),'delete',()=>{if(N)N.cancel(t.id);state.tasks=state.tasks.filter(x=>x.id!==id);save();render()})};dlg.showModal();$('cancelDelete').focus()}
let motionBusy=false;
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const waitMotion=ms=>new Promise(resolve=>setTimeout(resolve,reducedMotion()?0:ms));
async function animateRemoval(card,kind,action){
 if(motionBusy)return;
 if(!card||!card.isConnected||reducedMotion()){action();return}
 motionBusy=true;
 try{
  card.style.transition='transform 280ms ease-out, opacity 280ms ease-out';
  card.style.transform=kind==='done'?'translateX(110%)':'scale(.96)';
  card.style.opacity='0';
  await waitMotion(280);
  const main=$('main'), viewport=main.getBoundingClientRect(), first=new Map();
  for(const el of main.querySelectorAll('.task[data-task]')){
   if(el===card)continue;
   const r=el.parentElement.getBoundingClientRect();
   if(r.height&&r.bottom>viewport.top&&r.top<viewport.bottom)first.set(el.dataset.task,r.top);
  }
  motionBusy=false;
  action(); // render final layout once
  motionBusy=true;
  const animations=[];
  for(const el of main.querySelectorAll('.task[data-task]')){
   const wrap=el.parentElement,r=wrap.getBoundingClientRect();
   if(!r.height||r.bottom<=viewport.top||r.top>=viewport.bottom)continue;
   const old=first.get(el.dataset.task);
   if(old===undefined)continue;
   const dy=old-r.top;
   if(Math.abs(dy)>0.5)animations.push([wrap,dy]);
  }
  const running=animations.map(([wrap,dy])=>wrap.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.2,.7,.2,1)'}));
  await Promise.all(running.map(a=>a.finished.catch(()=>{})));
 }finally{motionBusy=false;}
}
function findCard(id){return [...agenda.querySelectorAll('.task[data-task]')].find(c=>c.dataset.task===id)}
let gesture=null, suppressClickUntil=0;const agenda=$('main');
agenda.addEventListener('pointerdown',e=>{const card=e.target.closest('.task[data-task]');if(e.clientX<24||e.clientX>document.documentElement.clientWidth-24)return;if(motionBusy||!card||e.target.closest('button')||!e.isPrimary||e.button!==0)return;gesture={card,wrap:card.parentElement,x:e.clientX,y:e.clientY,id:e.pointerId,dx:0,axis:null};});
agenda.addEventListener('pointermove',e=>{const g=gesture;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.axis&&Math.max(Math.abs(dx),Math.abs(dy))>9){g.axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';if(g.axis==='x')g.card.setPointerCapture(e.pointerId)}if(g.axis!=='x')return;g.dx=dx;const reached=Math.abs(dx)>=Math.min(100,g.card.offsetWidth*.28);if(reached&&!g.reached&&N&&N.haptic)N.haptic();g.reached=reached;g.card.style.transition='none';g.card.style.transform=`translateX(${Math.max(-g.card.offsetWidth,Math.min(g.card.offsetWidth,dx))}px)`;g.wrap.classList.add('swiping');g.wrap.classList.toggle('delete',dx<0);g.wrap.querySelector('.swipe-label').textContent=dx<0?'Usuń':g.card.classList.contains('completed')?'Przywróć':'✓ Gotowe';});
function finishSwipe(e,cancel){const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;if(g.axis!=='x')return;suppressClickUntil=Date.now()+550;const threshold=Math.min(100,g.card.offsetWidth*.28);if(!cancel&&g.dx>=threshold){animateRemoval(g.card,'done',()=>toggle(g.card.dataset.task));return}g.card.style.transition=reducedMotion()?'none':'transform 220ms ease-out';g.card.style.transform='';setTimeout(()=>{if(gesture?.wrap!==g.wrap&&!motionBusy)g.wrap.classList.remove('swiping','delete')},220);if(!cancel&&g.dx<=-threshold)askDelete(g.card.dataset.task)}
agenda.addEventListener('pointerup',e=>finishSwipe(e,false));agenda.addEventListener('pointercancel',e=>finishSwipe(e,true));agenda.addEventListener('click',e=>{if(motionBusy||Date.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();return}const c=e.target.closest('.task[data-task]');if(c&&!e.target.closest('button'))edit(c.dataset.task)},true);agenda.addEventListener('keydown',e=>{if(!motionBusy&&e.target.matches('.task[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();edit(e.target.dataset.task)}});
applyFullscreen();render();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dlg.open&&!pageKind)render()});window.addEventListener('focus',()=>{if(!dlg.open&&!pageKind)render()});setInterval(()=>{if(!dlg.open&&!pageKind)render()},60000);
