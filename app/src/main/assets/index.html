/* Consistent task editor spacing, in CSS pixels. */
.task-editor{--field-gap:6px;--control-gap:16px;--section-gap:20px;display:flex;flex-direction:column;align-items:stretch;gap:0}
.task-editor > *{margin:0;min-width:0}
.task-editor > label{margin-top:var(--control-gap);margin-bottom:var(--field-gap);line-height:20px}
.task-editor > .row h2{margin:0;line-height:1.25}
.task-editor > input:not([type=checkbox]),.task-editor > select,.task-editor > textarea{display:block;line-height:20px;min-height:46px;padding:12px}
.task-editor > textarea{min-height:70px;resize:vertical}
.task-editor > .actions{margin-top:var(--control-gap);gap:8px}
.task-editor > hr{margin:var(--section-gap) 0;width:100%}
.task-editor > hr + label,.task-editor > hr + h3{margin-top:0}
.task-editor > h3{margin:var(--section-gap) 0 var(--control-gap);line-height:1.25}
.task-editor > .reminder-toggle{display:flex;align-items:center;gap:8px;min-height:24px;line-height:24px}
.task-editor #rem{appearance:none;-webkit-appearance:none;display:grid;place-items:center;width:22px;height:22px;flex:0 0 22px;margin:0;padding:0;border:1px solid #777b72;border-radius:4px;background:white}
.task-editor #rem:checked{background:#52664b;border-color:#52664b}
.task-editor #rem:checked::after{content:'';width:6px;height:11px;border:solid white;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.task-editor > button.light{align-self:flex-start;margin:0}
.task-editor > #comment + button.light,.task-editor > .check + button.light{margin-top:var(--control-gap)}
.task-editor > .check + .check,.task-editor > .comment + .comment,.task-editor > .comment + textarea{margin-top:8px}
.task-editor > .check input[type=checkbox]{margin:0;flex:0 0 22px;width:22px;height:22px}
.task-editor button:not(.icon):not(.swatches button){min-height:44px;line-height:20px}

const N=window.Native, colors=['#C6D2BC','#DCD0BD','#C4CDD9','#DCC1B8','#DADBC2','#D4CBDD'];let state;try{state=JSON.parse(N?N.load():localStorage.forma)}catch(e){}if(!state)state={spaces:[{id:'work',name:'Praca',color:colors[0]},{id:'home',name:'Dom',color:colors[1]},{id:'projects',name:'Projekty',color:colors[2]},{id:'personal',name:'Osobiste',color:colors[3]}],tasks:[]};let view='agenda', draft, spaceDraft;const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, today=()=>date(new Date()), fmt=s=>s?new Date(s+'T12:00').toLocaleDateString('pl-PL',{day:'numeric',month:'long'}):'Bez terminu', space=id=>state.spaces.find(s=>s.id===id)||{name:'Inne',color:colors[0]};function save(){let s=JSON.stringify(state);if(N)N.save(s);else localStorage.forma=s}function progress(ts){return ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0}function bar(p){return `<div class="bar"><b style="width:${p}%"></b></div>`}function dates(t){let h='';for(let i=0;i<14;i++){let d=new Date();d.setDate(d.getDate()+i);h+=`<span class="day ${i===0?'today':''} ${[0,6].includes(d.getDay())?'week':''} ${date(d)===t.date?'selected':''}" aria-label="${date(d)}">${d.getDate()}</span>`}return `<div class="dates">${h}</div>`}function reminderDate(t){if(!t.date||!t.rem||!/^([01]\d|2[0-3]):[0-5]\d$/.test(t.hour||''))return null;let d=new Date(t.date+'T'+t.hour);d.setDate(d.getDate()-Number(t.offset||0));return isNaN(d)?null:d}
function taskColor(t,now=new Date()){if(t.important===true)return "#DFA9A2";let r=reminderDate(t);let due=t.date?new Date(t.date+'T'+(t.dueHour||'00:00')):null;if(due&&!t.dueHour)due.setDate(due.getDate()+1);if(!t.done&&((due&&due<=now)||(r&&r<=now)))return "#D5D5D2";return t.date&&(t.dueHour||r)?"#E8D3A2":"#C6D2BC"}function card(t){let s={color:taskColor(t)};let label=t.date?new Date(t.date+'T12:00').toLocaleDateString('pl-PL',{day:'numeric',month:'short',...(t.date.slice(0,4)!==today().slice(0,4)?{year:'numeric'}:{})}):'Bez terminu';let reminder='', reminderLabel='';if(t.rem&&t.date&&t.hour){let d=new Date(t.date+'T'+t.hour);d.setDate(d.getDate()-Number(t.offset||0));if(!isNaN(d)){reminder='Przypomnienie: '+fmt(date(d))+' '+t.hour;reminderLabel=(date(d)!==t.date?d.toLocaleDateString('pl-PL',{day:'numeric',month:'short'})+' ':'')+t.hour}}return `<article data-task="${esc(t.id)}" tabindex="0" class="task ${t.done?'completed':''}" style="background:${s.color}"><div class="row"><h3 style="flex:1;min-width:0">${esc(t.name)}</h3><div class="task-meta">${reminderLabel?`<small class="reminder-label" title="${esc(reminder)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>${esc(reminderLabel)} ·</small>`:''}<small class="task-date ${t.date&&t.date<today()&&!t.done?'late':''}" title="${esc(reminder||fmt(t.date))}">${esc((t.date&&t.dueHour&&!(reminderLabel===t.dueHour)?t.dueHour+" · ":"")+label)}</small></div></div>${dates(t)}</article>`}function compareTasks(a,b){const dateOrder=(a.date||'9999-12-31').localeCompare(b.date||'9999-12-31');if(dateOrder)return dateOrder;const hour=t=>t.date&&t.dueHour?t.dueHour:t.date&&t.rem&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t.hour)?t.hour:'99:99';return hour(a).localeCompare(hour(b)) || (b.created||0)-(a.created||0)}function render(){applyTileStyle();let ts=state.tasks.slice().sort(compareTasks);let h=`<header><small>${new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()}</small><button class="icon" onclick="settings()">⚙</button></header>`;h+=`<h1>${esc(agendaName(state.agendaTitle))}</h1>`;let active=ts.filter(t=>!t.done),done=ts.filter(t=>t.done);h+=active.map(swipeCard).join('')||'<div class="empty">Brak aktywnych zadań.</div>';if(done.length)h+=`<details><summary>Ukończone (${done.length})</summary>${done.map(swipeCard).join('')}</details>`;$('main').innerHTML=h}function sync(t){if(!N)return;if(t.done||!t.rem||!t.date)N.cancel(t.id);else{let d=new Date(t.date+'T'+t.hour);d.setDate(d.getDate()-Number(t.offset));let msg=N.schedule(t.id,t.name,d.getTime());if(msg!=='Zapisano przypomnienie')alert(msg)}}function toggle(id){let t=state.tasks.find(t=>t.id===id);t.done=!t.done;sync(t);save();render()}
function edit(id){let t=state.tasks.find(t=>t.id===id);draft=t?JSON.parse(JSON.stringify(t)):{id:uid(),created:Date.now(),name:'',desc:'',space:state.spaces.some(s=>s.id===view)?view:state.spaces[0]?.id,color:colors[0],date:'',dueHour:'',important:false,check:[],comments:[],rem:true,hour:'09:00',offset:0,done:false};showEdit();if(!t)$('name').setAttribute('autofocus','');else dlg.querySelector('button').setAttribute('autofocus','');$('dlg').showModal();if(!t){$('name').focus({preventScroll:true});if(N)N.keyboard()}}function capture(){for(let k of ['name','desc','date','hour','offset','dueHour'])if($(k))draft[k]=$(k).value;if($('important'))draft.important=$('important').checked;if($('allDay')?.checked)draft.dueHour='';if($('rem'))draft.rem=$('rem').checked;if($('comment'))draft.pendingComment=$('comment').value;draft.check.forEach((c,i)=>{if($('ct'+i)){c.text=$('ct'+i).value;c.done=$('cd'+i).checked}})}function showEdit(){let t=draft;$('dlg').innerHTML=`<div class="task-editor"><div class="row"><h2>${t.name?'Edytuj zadanie':'Nowe zadanie'}.</h2><button class="icon" onclick="dlg.close()">×</button></div><label>Nazwa</label><input id="name" value="${esc(t.name)}"><label class="reminder-toggle"><input type="checkbox" id="important" ${t.important?'checked':''}> Ważne</label><label>Opis</label><textarea id="desc">${esc(t.desc)}</textarea><label for="date">Termin realizacji</label><input type="date" id="date" value="${esc(t.date)}"><div class="actions"><button class="light" onclick="$('date').value=today()">Dzisiaj</button><button class="light" onclick="let d=new Date();d.setDate(d.getDate()+1);$('date').value=date(d)">Jutro</button><button class="light" onclick="document.getElementById('date').value=''">Bez terminu</button></div><label class="reminder-toggle"><input type="checkbox" id="allDay" ${!t.dueHour?'checked':''} onchange="$('dueTimeWrap').hidden=this.checked"> Całodniowe</label><div id="dueTimeWrap" ${!t.dueHour?'hidden':''}><label for="dueHour">Godzina realizacji</label><input type="time" id="dueHour" value="${esc(t.dueHour||'09:00')}"></div><hr><label class="reminder-toggle"><input type="checkbox" id="rem" ${t.rem?'checked':''} onchange="if(this.checked&&N)N.permissions()"> Przypomnienie</label><select id="offset">${[0,1,3,7].map(n=>`<option value="${n}" ${Number(t.offset)===n?'selected':''}>${n===0?'W dniu terminu':n+' dni wcześniej'}</option>`).join('')}</select><label>Godzina przypomnienia</label><input type="time" id="hour" value="${esc(t.hour)}"><hr><h3>Checklista</h3>${t.check.map((c,i)=>`<div class="check"><input type="checkbox" id="cd${i}" ${c.done?'checked':''}><input type="text" id="ct${i}" value="${esc(c.text)}"><button class="icon" onclick="capture();draft.check.splice(${i},1);showEdit()">×</button></div>`).join('')}<button class="light" onclick="capture();draft.check.push({text:'',done:false});showEdit()">＋ Punkt</button><h3>Komentarze</h3>${t.comments.map((c,i)=>`<div class="comment"><small>${esc(c.date)}</small><div>${esc(c.text)}</div><button class="icon" onclick="capture();draft.comments.splice(${i},1);showEdit()">×</button></div>`).join('')}<textarea id="comment" placeholder="Nowy komentarz">${esc(t.pendingComment||'')}</textarea><button class="light" onclick="capture();if(comment.value.trim())draft.comments.push({text:comment.value.trim(),date:new Date().toLocaleString('pl-PL')});draft.pendingComment='';showEdit()">Dodaj komentarz</button><div class="actions"><button onclick="commit()">Zapisz</button>${state.tasks.some(x=>x.id===t.id)?`<button class="light" onclick="commitStatus()">${t.done?'Przywróć':'Ukończ'}</button><button class="light" onclick="removeTask()">Usuń</button>`:''}</div></div>`}function commit(){capture();if(!draft.name.trim())return alert('Podaj nazwę');if(!draft.date){draft.rem=false;draft.dueHour=''}draft.check=draft.check.filter(c=>c.text.trim());if($('comment')?.value.trim())draft.comments.push({text:$('comment').value.trim(),date:new Date().toLocaleString('pl-PL')});delete draft.pendingComment;let i=state.tasks.findIndex(t=>t.id===draft.id);if(i<0)state.tasks.push(draft);else state.tasks[i]=draft;sync(draft);save();dlg.close();render()}function removeTask(){if(!confirm('Usunąć zadanie?'))return;if(N){N.cancel(draft.id)}state.tasks=state.tasks.filter(t=>t.id!==draft.id);save();dlg.close();render()}
function editSpace(id){spaceDraft=state.spaces.find(s=>s.id===id);spaceDraft=spaceDraft?{...spaceDraft}:{id:uid(),name:'',color:colors[0]};showSpace();dlg.showModal()}function showSpace(){ $('dlg').innerHTML=`<h2>Przestrzeń.</h2><label>Nazwa</label><input id="sn" value="${esc(spaceDraft.name)}"><label>Kolor</label><div class="swatches">${colors.map(c=>`<button style="background:${c}" class="${c===spaceDraft.color?'chosen':''}" onclick="spaceDraft.name=sn.value;spaceDraft.color='${c}';showSpace()"></button>`).join('')}</div><div class="actions"><button onclick="saveSpace()">Zapisz</button><button class="light" onclick="dlg.close()">Anuluj</button></div>`}function saveSpace(){spaceDraft.name=sn.value.trim();if(!spaceDraft.name)return;let i=state.spaces.findIndex(s=>s.id===spaceDraft.id);if(i<0)state.spaces.push(spaceDraft);else state.spaces[i]=spaceDraft;save();dlg.close();render()}function exportJSON(){state.tileRadius=tileStyle(state.tileRadius);state.fullscreen=state.fullscreen!==false;state.agendaTitle=agendaName(state.agendaTitle);save();const backup={format:'forma-backup',version:1,exportedAt:new Date().toISOString(),state};if(N){N.exportBackup(JSON.stringify(backup,null,2));return}const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='FORMA-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function agendaName(v){return typeof v==='string'&&v.trim()?v.trim().slice(0,60):'Agenda.'}function saveAgendaName(){state.agendaTitle=agendaName($('agendaTitle').value);save();render();dlg.close()}function validateBackup(raw){const b=raw?.format==='forma-backup'&&raw.version===1?raw.state:raw;const ok=(v)=>typeof v==='string';const id=v=>ok(v)&&/^[a-zA-Z0-9_-]{1,128}$/.test(v);const day=v=>v===''||(ok(v)&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v);if(!b||!Array.isArray(b.tasks)||!Array.isArray(b.spaces))throw Error('Nieprawidłowy format kopii.');const seen=new Set();const spaces=b.spaces.map(s=>{if(!s||!id(s.id)||!ok(s.name)||!colors.includes(s.color))throw Error('Nieprawidłowa przestrzeń.');return {id:s.id,name:s.name,color:s.color}});const tasks=b.tasks.map(t=>{if(!t||!id(t.id)||seen.has(t.id)||!ok(t.name)||!t.name.trim()||!day(t.date)||!Array.isArray(t.check)||!Array.isArray(t.comments))throw Error('Nieprawidłowe zadanie lub powtórzony identyfikator.');seen.add(t.id);if(t.check.some(c=>!c||!ok(c.text)||typeof c.done!=='boolean')||t.comments.some(c=>!c||!ok(c.text)||!ok(c.date)))throw Error('Nieprawidłowa checklista lub komentarz.');return {id:t.id,name:t.name,desc:ok(t.desc)?t.desc:'',space:id(t.space)?t.space:'work',color:colors.includes(t.color)?t.color:colors[0],date:t.date,important:t.important===true,dueHour:t.date&&ok(t.dueHour)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t.dueHour)?t.dueHour:'',created:Number.isFinite(t.created)?t.created:0,done:t.done===true,check:t.check.map(c=>({text:c.text,done:c.done})),comments:t.comments.map(c=>({text:c.text,date:c.date})),rem:t.rem===true,hour:ok(t.hour)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t.hour)?t.hour:'09:00',offset:[0,1,3,7].includes(Number(t.offset))?Number(t.offset):0}});return {spaces,tasks,agendaTitle:agendaName(b.agendaTitle),fullscreen:b.fullscreen!==false,tileRadius:tileStyle(b.tileRadius)}}
async function importJSON(input){const file=input.files[0];input.value='';if(!file)return;try{if(file.size>10000000)throw Error('Plik jest za duży (maks. 10 MB).');const next=validateBackup(JSON.parse(await file.text()));if(!confirm('Importować '+next.tasks.length+' zadań? Obecne dane zostaną zastąpione. Najpierw możesz wyeksportować kopię.'))return;if(N){for(const t of state.tasks){N.cancel(t.id)}}state=next;save();applyFullscreen();if(N)for(const t of state.tasks)sync(t);dlg.close();render();alert('Zaimportowano '+next.tasks.length+' zadań.')}catch(e){alert('Nie udało się zaimportować: '+e.message)}}
function tileStyle(v){return [0,4,18].includes(v)?v:0}function applyTileStyle(){document.documentElement.style.setProperty("--tile-radius",tileStyle(state.tileRadius)+"px")}function setTileStyle(v){state.tileRadius=tileStyle(Number(v));save();applyTileStyle()}function applyFullscreen(){if(N&&N.fullscreen)N.fullscreen(state.fullscreen!==false)}function setFullscreen(v){state.fullscreen=v;save();applyFullscreen()}function updateAlarmStatus(){let el=$('alarmStatus');if(el)el.textContent=N?N.alarmStatus():'Podgląd HTML'}window.addEventListener('focus',updateAlarmStatus);function settings(){setTimeout(updateAlarmStatus,0);dlg.innerHTML='<h2>Ustawienia.</h2><label for="agendaTitle">Nazwa agendy</label><input id="agendaTitle" maxlength="60" placeholder="Agenda."><div class="actions"><button onclick="saveAgendaName()">Zapisz nazwę</button></div><hr><label style="display:flex;align-items:center;justify-content:space-between;gap:12px">Tryb pełnoekranowy<input id="fullToggle" type="checkbox" style="width:24px;height:24px;accent-color:#687C60" onchange="setFullscreen(this.checked)"></label><label for="tileStyle">Styl kafelków</label><select id="tileStyle" onchange="setTileStyle(this.value)"><option value="0">Ostre</option><option value="4">Subtelne</option><option value="18">Zaokrąglone</option></select><hr><p>FORMA działa lokalnie. Przypomnienia wymagają zgody systemowej.</p><p id="alarmStatus"></p><button class="light" onclick="if(N)N.permissions()">Uprawnienia przypomnień</button><button class="light" style="margin-top:16px" onclick="if(N)alert(N.testAlarm())">Test powiadomienia (15 s)</button><hr><h3>Kopia zapasowa</h3><p class="muted">Eksport zapisuje wszystkie zadania, nazwę agendy i ustawienia wyglądu. Import zastępuje aktualne dane.</p><div class="actions"><button onclick="exportJSON()">Eksport JSON</button><button class="light" onclick="document.getElementById(&quot;backupFile&quot;).click()">Import JSON</button></div><input id="backupFile" type="file" accept=".json,application/json" hidden onchange="importJSON(this)"><hr><div class="actions"><button onclick="if(N)N.permissions();else alert(&quot;Dostępne w APK&quot;)">Uprawnienia przypomnień</button><button class="light" autofocus onclick="dlg.close()">Zamknij</button></div>';$('agendaTitle').value=agendaName(state.agendaTitle);$('fullToggle').checked=state.fullscreen!==false;$('tileStyle').value=String(tileStyle(state.tileRadius));dlg.showModal()}function swipeCard(t){return `<div class="swipe-wrap"><div class="swipe-label" aria-hidden="true"></div>${card(t)}</div>`}
function commitStatus(){capture();draft.done=!draft.done;commit()}
function askDelete(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;dlg.innerHTML=`<h2>Usunąć zadanie?</h2><p>${esc(t.name)}</p><p class="muted">Tej operacji nie można cofnąć.</p><div class="actions"><button class="light" id="cancelDelete">Anuluj</button><button class="danger" id="confirmDelete">Usuń</button></div>`;$('cancelDelete').onclick=()=>dlg.close();$('confirmDelete').onclick=()=>{if(N){N.cancel(t.id)}state.tasks=state.tasks.filter(x=>x.id!==id);save();dlg.close();render()};dlg.showModal();$('cancelDelete').focus()}
let gesture=null, suppressClickUntil=0;const agenda=$('main');
agenda.addEventListener('pointerdown',e=>{const card=e.target.closest('.task[data-task]');if(!card||e.target.closest('button')||!e.isPrimary||e.button!==0)return;gesture={card,wrap:card.parentElement,x:e.clientX,y:e.clientY,id:e.pointerId,dx:0,axis:null};});
agenda.addEventListener('pointermove',e=>{const g=gesture;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!g.axis&&Math.max(Math.abs(dx),Math.abs(dy))>9){g.axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';if(g.axis==='x')g.card.setPointerCapture(e.pointerId)}if(g.axis!=='x')return;g.dx=dx;g.card.style.transition='none';g.card.style.transform=`translateX(${Math.max(-g.card.offsetWidth,Math.min(g.card.offsetWidth,dx))}px)`;g.wrap.classList.toggle('delete',dx<0);g.wrap.querySelector('.swipe-label').textContent=dx<0?'Usuń':g.card.classList.contains('completed')?'Przywróć':'✓ Gotowe';});
function finishSwipe(e,cancel){const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;if(g.axis!=='x')return;suppressClickUntil=Date.now()+450;g.card.style.transition='transform 160ms ease-out';g.card.style.transform='';if(cancel)return;const threshold=Math.min(100,g.card.offsetWidth*.28);if(g.dx>=threshold)toggle(g.card.dataset.task);else if(g.dx<=-threshold)askDelete(g.card.dataset.task)}
agenda.addEventListener('pointerup',e=>finishSwipe(e,false));agenda.addEventListener('pointercancel',e=>finishSwipe(e,true));agenda.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();return}const c=e.target.closest('.task[data-task]');if(c&&!e.target.closest('button'))edit(c.dataset.task)},true);agenda.addEventListener('keydown',e=>{if(e.target.matches('.task[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();edit(e.target.dataset.task)}});
applyFullscreen();render();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dlg.open)render()});window.addEventListener('focus',()=>{if(!dlg.open)render()});setInterval(()=>{if(!dlg.open)render()},60000);
</script></html>
