<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1ec;color:#242624;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:22px 16px 100px}h1{font-size:46px;letter-spacing:-3px;margin:8px 0}h2{letter-spacing:-1px}small,.muted{color:#555950;font-size:12px}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:12px;background:#242624;color:white;cursor:pointer}button.light{background:#e5e3dc;color:#242624}button.icon{background:transparent;color:inherit;padding:8px;font-size:20px}header,.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.task,.summary{border-radius:18px;padding:16px;margin:12px 0}.grid .tile{margin:0;min-height:140px}.tile h2{margin:28px 0 4px}.summary{background:#242624;color:white}.summary small{color:#ddd}.bar{height:5px;background:#ffffff80;border-radius:8px;margin-top:12px;overflow:hidden}.bar b{display:block;height:100%;background:#41483d}.summary .bar b{background:#c6d2bc}.dates{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;margin-top:14px}.day{aspect-ratio:1;display:grid;place-items:center;background:#ffffff80;border-radius:3px;font-size:10px;position:relative}.week{background:#24262415}.today{outline:1px solid #565b50}.selected{background:#30352e;color:white}.late{color:#963f36;font-weight:700}.task h3{margin:0;font-size:18px;overflow-wrap:anywhere}.task p{white-space:pre-wrap;overflow-wrap:anywhere}.task .meta{margin-top:10px;font-size:12px}.task .foot{margin-top:10px;text-align:right}nav{position:fixed;bottom:0;left:0;right:0;background:#f3f1ec;border-top:1px solid #d5d3cb;display:flex;justify-content:center;gap:10px;padding:12px}nav button{flex:1;max-width:150px}dialog{border:0;border-radius:22px;background:#f3f1ec;color:#242624;width:calc(100% - 24px);max-width:550px;max-height:90vh;padding:20px}dialog::backdrop{background:#24262480}label{display:block;margin:14px 0 5px;font-size:13px;font-weight:600}input:not([type=checkbox]),textarea,select{width:100%;border:1px solid #d0d0c8;background:white;border-radius:10px;padding:12px;color:#242624}textarea{min-height:70px}.check{display:flex;gap:10px;align-items:center;margin:8px 0}.check input[type=checkbox]{width:22px;height:22px;accent-color:#52664b}.check input[type=text]{flex:1;min-width:0}.comment{background:#e5e3dc;padding:10px;border-radius:10px;margin:8px 0;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1}details{margin-top:24px}hr{border:0;border-top:1px solid #d4d2ca;margin:20px 0}.empty{padding:24px;text-align:center;color:#666} .swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches button{width:36px;height:36px;padding:0;border:2px solid transparent}.swatches .chosen{border-color:#242624}
</style><main id="main"></main><nav><button class="light" onclick="view='home';render()">▦ Przestrzenie</button><button onclick="edit()">＋ Zadanie</button><button class="light" onclick="view='agenda';render()">Agenda</button></nav><dialog id="dlg"></dialog><script>
const N=window.Native, colors=['#C6D2BC','#DCD0BD','#C4CDD9','#DCC1B8','#DADBC2','#D4CBDD'];let state;try{state=JSON.parse(N?N.load():localStorage.forma)}catch(e){}if(!state)state={spaces:[{id:'work',name:'Praca',color:colors[0]},{id:'home',name:'Dom',color:colors[1]},{id:'projects',name:'Projekty',color:colors[2]},{id:'personal',name:'Osobiste',color:colors[3]}],tasks:[]};let view='home', draft, spaceDraft;const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, today=()=>date(new Date()), fmt=s=>s?new Date(s+'T12:00').toLocaleDateString('pl-PL',{day:'numeric',month:'long'}):'Bez terminu', space=id=>state.spaces.find(s=>s.id===id)||{name:'Inne',color:colors[0]};function save(){let s=JSON.stringify(state);if(N)N.save(s);else localStorage.forma=s}function progress(ts){return ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0}function bar(p){return `<div class="bar"><b style="width:${p}%"></b></div>`}function dates(t){if(!t.date)return '';let h='';for(let i=0;i<14;i++){let d=new Date();d.setDate(d.getDate()+i);h+=`<span class="day ${i===0?'today':''} ${[0,6].includes(d.getDay())?'week':''} ${date(d)===t.date?'selected':''}" aria-label="${date(d)}">${d.getDate()}</span>`}return `<div class="dates">${h}</div>`}function card(t){let s=space(t.space);return `<article class="task" style="background:${s.color}"><div class="row"><button class="icon" aria-label="Zmień status" onclick="toggle('${t.id}')">${t.done?'✓':'○'}</button><h3 style="flex:1" onclick="edit('${t.id}')">${esc(t.name)}</h3><button class="icon" onclick="edit('${t.id}')">⋯</button></div>${t.desc?`<p>${esc(t.desc)}</p>`:''}<div class="row meta"><span>☷ ${t.check.filter(c=>c.done).length}/${t.check.length}　▤ ${t.comments.length}</span><span>${t.rem?'♧ '+esc(t.hour):''} ${t.event?' ▣':''}</span></div>${dates(t)}<div class="foot ${t.date&&t.date<today()&&!t.done?'late':''}"><small>${esc(s.name.toUpperCase())} · ${fmt(t.date)}</small></div></article>`}function render(){let ts=state.tasks.slice().sort((a,b)=>b.created-a.created);let h=`<header><small>${new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()}</small><button class="icon" onclick="settings()">⚙</button></header>`;if(view==='home'){h+=`<h1>forma.</h1><div class="muted">Twoja przestrzeń. Twój rytm.</div><div class="summary"><small>TWOJE ZADANIA</small><h2>${ts.filter(t=>t.done).length} / ${ts.length}</h2>${bar(progress(ts))}</div><div class="grid">${state.spaces.map(s=>{let a=ts.filter(t=>t.space===s.id);return `<div class="tile" style="background:${s.color}" onclick="view='${s.id}';render()"><div class="row"><span>▦</span><span>↗</span></div><h2>${esc(s.name)}.</h2><small>${a.filter(t=>!t.done).length} aktywnych</small>${bar(progress(a))}</div>`}).join('')}</div><div class="actions"><button class="light" onclick="editSpace()">＋ Nowa przestrzeń</button></div><h2>Najnowsze</h2>`;ts=ts.filter(t=>!t.done).slice(0,5)}else if(view==='agenda'){h+='<h1>Agenda.</h1>';ts=ts.filter(t=>t.date)}else{let s=space(view);h+=`<div class="row"><button class="light" onclick="view='home';render()">←</button><button class="light" onclick="editSpace('${s.id}')">Edytuj przestrzeń</button></div><div class="tile" style="background:${s.color}"><h1>${esc(s.name)}.</h1>${bar(progress(ts.filter(t=>t.space===s.id)))}</div>`;ts=ts.filter(t=>t.space===view)}let active=ts.filter(t=>!t.done),done=ts.filter(t=>t.done);h+=active.map(card).join('')||'<div class="empty">Brak aktywnych zadań.</div>';if(done.length)h+=`<details><summary>Ukończone (${done.length})</summary>${done.map(card).join('')}</details>`;$('main').innerHTML=h}function sync(t){if(!N)return;if(t.done||!t.rem||!t.date)N.cancel(t.id);else{let d=new Date(t.date+'T'+t.hour);d.setDate(d.getDate()-Number(t.offset));let msg=N.schedule(t.id,t.name,d.getTime());if(msg!=='Zapisano przypomnienie')alert(msg)}if(t.event){if(t.done||!t.date){if(N.removeEvent(t.event))t.event='';else alert('Nie udało się usunąć wydarzenia.')}else{let id=N.event(t.event,t.cal,t.name,Date.parse(t.date+'T00:00:00Z'),t.desc);if(id)t.event=id;else alert('Nie udało się zaktualizować kalendarza.')}}}function toggle(id){let t=state.tasks.find(t=>t.id===id);t.done=!t.done;sync(t);save();render()}
function edit(id){let t=state.tasks.find(t=>t.id===id);draft=t?JSON.parse(JSON.stringify(t)):{id:uid(),created:Date.now(),name:'',desc:'',space:state.spaces.some(s=>s.id===view)?view:state.spaces[0]?.id,date:'',check:[],comments:[],rem:false,hour:'09:00',offset:0,event:'',cal:'',done:false};showEdit();$('dlg').showModal()}function capture(){for(let k of ['name','desc','space','date','hour','offset'])if($(k))draft[k]=$(k).value;if($('rem'))draft.rem=$('rem').checked;draft.check.forEach((c,i)=>{if($('ct'+i)){c.text=$('ct'+i).value;c.done=$('cd'+i).checked}})}function showEdit(){let t=draft;$('dlg').innerHTML=`<div class="row"><h2>${t.name?'Edytuj zadanie':'Nowe zadanie'}.</h2><button class="icon" onclick="dlg.close()">×</button></div><label>Nazwa</label><input id="name" value="${esc(t.name)}"><label>Przestrzeń</label><select id="space">${state.spaces.map(s=>`<option value="${s.id}" ${s.id===t.space?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Opis</label><textarea id="desc">${esc(t.desc)}</textarea><label>Termin</label><input type="date" id="date" value="${esc(t.date)}"><hr><h3>Checklista</h3>${t.check.map((c,i)=>`<div class="check"><input type="checkbox" id="cd${i}" ${c.done?'checked':''}><input type="text" id="ct${i}" value="${esc(c.text)}"><button class="icon" onclick="capture();draft.check.splice(${i},1);showEdit()">×</button></div>`).join('')}<button class="light" onclick="capture();draft.check.push({text:'',done:false});showEdit()">＋ Punkt</button><h3>Komentarze</h3>${t.comments.map((c,i)=>`<div class="comment"><small>${esc(c.date)}</small><div>${esc(c.text)}</div><button class="icon" onclick="capture();draft.comments.splice(${i},1);showEdit()">×</button></div>`).join('')}<textarea id="comment" placeholder="Nowy komentarz"></textarea><button class="light" onclick="capture();if(comment.value.trim())draft.comments.push({text:comment.value.trim(),date:new Date().toLocaleString('pl-PL')});showEdit()">Dodaj komentarz</button><hr><label><input type="checkbox" id="rem" ${t.rem?'checked':''} onchange="if(this.checked&&N)N.permissions()"> Przypomnienie</label><select id="offset">${[0,1,3,7].map(n=>`<option value="${n}" ${Number(t.offset)===n?'selected':''}>${n===0?'W dniu terminu':n+' dni wcześniej'}</option>`).join('')}</select><label>Godzina</label><input type="time" id="hour" value="${esc(t.hour)}"><hr><h3>Kalendarz</h3><div id="calarea"><button class="light" onclick="calendar()">${t.event?'Usuń z kalendarza':'Dodaj do kalendarza'}</button></div><div class="actions"><button onclick="commit()">Zapisz</button>${state.tasks.some(x=>x.id===t.id)?'<button class="light" onclick="removeTask()">Usuń</button>':''}</div>`}function commit(){capture();if(!draft.name.trim())return alert('Podaj nazwę');if(draft.rem&&!draft.date)return alert('Ustaw termin');draft.check=draft.check.filter(c=>c.text.trim());if($('comment')?.value.trim())draft.comments.push({text:$('comment').value.trim(),date:new Date().toLocaleString('pl-PL')});let i=state.tasks.findIndex(t=>t.id===draft.id);if(i<0)state.tasks.push(draft);else state.tasks[i]=draft;sync(draft);save();dlg.close();render()}function calendar(){capture();if(!N)return alert('Dostępne w APK');if(!draft.name.trim()||!draft.date)return alert('Podaj nazwę i termin');if(draft.event){if(!confirm('Usunąć wydarzenie z kalendarza?'))return;if(!N.removeEvent(draft.event))return alert('Brak dostępu do kalendarza');draft.event='';persistCalendar();showEdit();return}let a=JSON.parse(N.calendars());if(!a.length)return alert('Zezwól na dostęp do kalendarza i spróbuj ponownie. Sprawdź też konto Google.');$('calarea').innerHTML=`<select id="cal">${a.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button onclick="addCalendar()">Dodaj wydarzenie całodniowe</button>`}function persistCalendar(){let i=state.tasks.findIndex(t=>t.id===draft.id);if(i<0)state.tasks.push(JSON.parse(JSON.stringify(draft)));else{state.tasks[i].event=draft.event;state.tasks[i].cal=draft.cal}save();render()}function addCalendar(){capture();draft.cal=$('cal').value;let id=N.event('',draft.cal,draft.name,Date.parse(draft.date+'T00:00:00Z'),draft.desc);if(!id)return alert('Nie udało się dodać wydarzenia');draft.event=id;persistCalendar();showEdit()}function removeTask(){if(!confirm('Usunąć zadanie?'))return;if(N){if(draft.event&&!N.removeEvent(draft.event))return alert('Nie udało się usunąć wydarzenia');N.cancel(draft.id)}state.tasks=state.tasks.filter(t=>t.id!==draft.id);save();dlg.close();render()}
function editSpace(id){spaceDraft=state.spaces.find(s=>s.id===id);spaceDraft=spaceDraft?{...spaceDraft}:{id:uid(),name:'',color:colors[0]};showSpace();dlg.showModal()}function showSpace(){ $('dlg').innerHTML=`<h2>Przestrzeń.</h2><label>Nazwa</label><input id="sn" value="${esc(spaceDraft.name)}"><label>Kolor</label><div class="swatches">${colors.map(c=>`<button style="background:${c}" class="${c===spaceDraft.color?'chosen':''}" onclick="spaceDraft.name=sn.value;spaceDraft.color='${c}';showSpace()"></button>`).join('')}</div><div class="actions"><button onclick="saveSpace()">Zapisz</button><button class="light" onclick="dlg.close()">Anuluj</button></div>`}function saveSpace(){spaceDraft.name=sn.value.trim();if(!spaceDraft.name)return;let i=state.spaces.findIndex(s=>s.id===spaceDraft.id);if(i<0)state.spaces.push(spaceDraft);else state.spaces[i]=spaceDraft;save();dlg.close();render()}function settings(){dlg.innerHTML='<h2>Ustawienia.</h2><p>FORMA działa lokalnie. Kalendarz korzysta z kont skonfigurowanych w Androidzie.</p><div class="actions"><button onclick="if(N)N.permissions()">Uprawnienia przypomnień</button><button class="light" onclick="dlg.close()">Zamknij</button></div>';dlg.showModal()}render();setInterval(()=>{if(!dlg.open)render()},60000);
</script></html>
